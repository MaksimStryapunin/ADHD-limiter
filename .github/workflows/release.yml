name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  package:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: Windows-x64
            archive: ADHD-limiter-Windows-x64.zip
          - os: ubuntu-latest
            platform: Linux-x64
            archive: ADHD-limiter-Linux-x64.tar.gz
          - os: macos-latest
            platform: macOS-x64
            archive: ADHD-limiter-macOS-x64.tar.gz

    steps:
      - uses: actions/checkout@v4

      - name: Configure Windows
        if: runner.os == 'Windows'
        run: cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded

      - name: Configure Unix
        if: runner.os != 'Windows'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded

      - name: Build
        run: cmake --build build --config Release

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/package | Out-Null
          Copy-Item build/Release/ADHD-limiter.exe artifacts/package/ADHD-limiter.exe
          Compress-Archive -Path artifacts/package/ADHD-limiter.exe -DestinationPath artifacts/${{ matrix.archive }}

      - name: Package Unix
        if: runner.os != 'Windows'
        run: |
          mkdir -p artifacts/package
          cp build/ADHD-limiter artifacts/package/ADHD-limiter
          chmod +x artifacts/package/ADHD-limiter
          tar -czf "artifacts/${{ matrix.archive }}" -C artifacts/package ADHD-limiter

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.platform }}
          path: artifacts/${{ matrix.archive }}
          if-no-files-found: error

  release:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ADHD-limiter ${{ github.ref_name }}
          prerelease: ${{ startsWith(github.ref_name, 'v0.3.0-beta') }}
          body: |
            Исправлены визуальные баги: кнопка «Пуск» теперь квадратная с GDI-иконкой,
            треугольник больше не перевёрнут, иконка сброса перерисована, фон цифр
            больше не пропадает при запуске.

            Добавлен синхронизированный отсчёт: минуты в боксе, секунды в заголовке окна.
            Добавлена возможность редактирования названий таймеров («Отдых»/«Работа») по клику.
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
